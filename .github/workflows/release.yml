name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Build action
        run: npm run build

      - name: Verify dist is up to date for this tag
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale for this tag. Run 'npm run build', commit dist/, then re-create the tag."
            git status --porcelain dist
            exit 1
          fi

      - name: Update major version tag
        run: |
          MAJOR=$(echo "$GITHUB_REF_NAME" | grep -oE '^v[0-9]+' || true)
          if [ -z "$MAJOR" ]; then
            echo "::error::could not derive a vN major version from tag $GITHUB_REF_NAME"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_REF_NAME"
          git push -f origin "$MAJOR"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          # In the body below, ${{ '${{' }} emits a literal "${{" so the
          # published notes show the ${{ secrets.GITHUB_TOKEN }} placeholder
          # instead of interpolating the runtime token into the release page.
          body: |
            ## Changes

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Usage

            ```yaml
            - uses: MatloobAltaf/monorepo-code-coverage-reporter@${{ github.ref_name }}
              with:
                github-token: ${{ '${{' }} secrets.GITHUB_TOKEN }}
                coverage-folder: './coverage'
            ```
          draft: false
          prerelease: false
